<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 180" width="230" height="180">
  <title>Vienna Rectifier Phase Leg (3-Level Unidirectional PFC)</title>
  <desc>Vienna Rectifier Phase Leg (3-Level Unidirectional PFC)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_vienna_rectifier_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_vienna_rectifier_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_vienna_rectifier_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Input Boost Inductor -->
  <path class="ee-wire-a" d="M 15 90 L 35 90 A 6 7 0 0 1 47 90 A 6 7 0 0 1 59 90 A 6 7 0 0 1 71 90 L 115 90"/>
  <text class="ee-text" x="53" y="72">L<tspan dy="3" font-size="8">a</tspan></text>
  <!-- Main Diode Leg -->
  <line class="ee-stroke" x1="115" y1="20" x2="185" y2="20"/>
  <line class="ee-stroke" x1="115" y1="160" x2="185" y2="160"/>
  <line class="ee-stroke" x1="115" y1="20" x2="115" y2="160"/>
  <polygon class="ee-body" points="107,62 123,62 115,44"/><line class="ee-stroke" x1="107" y1="44" x2="123" y2="44"/>
  <polygon class="ee-body" points="107,136 123,136 115,118"/><line class="ee-stroke" x1="107" y1="118" x2="123" y2="118"/>
  <!-- Bidirectional Switch to Neutral O -->
  <rect class="ee-tint-blue" x="135" y="76" width="36" height="28" rx="3"/>
  <text class="ee-label" x="153" y="90">S<tspan dy="2" font-size="7">a</tspan></text>
  <line class="ee-stroke" x1="115" y1="90" x2="135" y2="90"/>
  <line class="ee-stroke" x1="171" y1="90" x2="215" y2="90"/>
  <text class="ee-label" x="205" y="78">O</text>
  <circle class="ee-node" cx="115" cy="90" r="2.5"/>
  <circle class="ee-pin" cx="15" cy="90" r="2.2"/>
  <circle class="ee-pin" cx="185" cy="20" r="2.2"/>
  <circle class="ee-pin" cx="215" cy="90" r="2.2"/>
  <circle class="ee-pin" cx="185" cy="160" r="2.2"/>
</svg>
