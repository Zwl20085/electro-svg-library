<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <title>3-Level T-Type Inverter Phase Leg</title>
  <desc>3-Level T-Type Inverter Phase Leg</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_3level_ttype_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_3level_ttype_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_3level_ttype_leg" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Split DC Link -->
  <line class="ee-stroke" x1="30" y1="20" x2="170" y2="20"/>
  <line class="ee-stroke" x1="30" y1="180" x2="170" y2="180"/>
  <line class="ee-stroke" x1="30" y1="20" x2="30" y2="55"/>
  <line class="ee-stroke" x1="18" y1="55" x2="42" y2="55"/>
  <line class="ee-stroke" x1="18" y1="63" x2="42" y2="63"/>
  <line class="ee-stroke" x1="30" y1="63" x2="30" y2="137"/>
  <line class="ee-stroke" x1="18" y1="137" x2="42" y2="137"/>
  <line class="ee-stroke" x1="18" y1="145" x2="42" y2="145"/>
  <line class="ee-stroke" x1="30" y1="145" x2="30" y2="180"/>
  <!-- Half bridge main switches S1, S4 at x=170 -->
  <line class="ee-stroke" x1="170" y1="20" x2="170" y2="42"/>
  <text class="ee-text" x="152" y="56" font-size="11">S1</text>
  <rect class="ee-tint-blue" x="160" y="42" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="165" y1="48" x2="165" y2="64"/>
  <path class="ee-thin" d="M 165 52 L 174 46 L 174 42"/>
  <path class="ee-thin" d="M 165 60 L 174 66 L 174 70"/>
  <polygon class="ee-fill" points="175,59 179,59 177,53"/>
  <line class="ee-stroke" x1="170" y1="70" x2="170" y2="130"/>
  <text class="ee-text" x="152" y="144" font-size="11">S4</text>
  <rect class="ee-tint-blue" x="160" y="130" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="165" y1="136" x2="165" y2="152"/>
  <path class="ee-thin" d="M 165 140 L 174 134 L 174 130"/>
  <path class="ee-thin" d="M 165 148 L 174 154 L 174 158"/>
  <polygon class="ee-fill" points="175,147 179,147 177,141"/>
  <line class="ee-stroke" x1="170" y1="158" x2="170" y2="180"/>
  <!-- Bidirectional Neutral Clamp Switch (S2/S3) between (30,100) and (170,100) -->
  <line class="ee-stroke" x1="30" y1="100" x2="76" y2="100"/>
  <rect class="ee-tint-amber" x="76" y="86" width="48" height="28" rx="3"/>
  <text class="ee-label" x="100" y="100">S2 / S3</text>
  <line class="ee-stroke" x1="124" y1="100" x2="220" y2="100"/>
  <text class="ee-text" x="208" y="86">AC</text>
  <circle class="ee-node" cx="30" cy="100" r="2.5"/>
  <circle class="ee-node" cx="170" cy="100" r="2.5"/>
  <circle class="ee-pin" cx="220" cy="100" r="2.2"/>
</svg>
