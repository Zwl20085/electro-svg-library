<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <title>Z-Source Impedance Network (L1, L2, C1, C2)</title>
  <desc>Z-Source Impedance Network (L1, L2, C1, C2)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_z_source_network" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_z_source_network" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_z_source_network" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Top and bottom rails -->
  <path class="ee-stroke" d="M 15 35 L 45 35 A 6 7 0 0 1 57 35 A 6 7 0 0 1 69 35 A 6 7 0 0 1 81 35 L 185 35"/>
  <path class="ee-stroke" d="M 15 125 L 45 125 A 6 7 0 0 0 57 125 A 6 7 0 0 0 69 125 A 6 7 0 0 0 81 125 L 185 125"/>
  <!-- Cross X capacitors C1, C2 -->
  <line class="ee-stroke" x1="35" y1="35" x2="92" y2="75"/>
  <line class="ee-stroke" x1="86" y1="81" x2="98" y2="69"/>
  <line class="ee-stroke" x1="92" y1="87" x2="104" y2="75"/>
  <line class="ee-stroke" x1="98" y1="81" x2="155" y2="125"/>
  <line class="ee-stroke" x1="35" y1="125" x2="92" y2="85"/>
  <line class="ee-stroke" x1="98" y1="79" x2="155" y2="35"/>
  <text class="ee-text" x="63" y="18">L<tspan dy="3" font-size="8">1</tspan></text>
  <text class="ee-text" x="63" y="145">L<tspan dy="3" font-size="8">2</tspan></text>
  <text class="ee-text" x="135" y="55">C<tspan dy="3" font-size="8">1</tspan></text>
  <text class="ee-text" x="135" y="108">C<tspan dy="3" font-size="8">2</tspan></text>
  <circle class="ee-node" cx="35" cy="35" r="2.5"/>
  <circle class="ee-node" cx="155" cy="35" r="2.5"/>
  <circle class="ee-node" cx="35" cy="125" r="2.5"/>
  <circle class="ee-node" cx="155" cy="125" r="2.5"/>
  <circle class="ee-pin" cx="15" cy="35" r="2.2"/>
  <circle class="ee-pin" cx="15" cy="125" r="2.2"/>
  <circle class="ee-pin" cx="185" cy="35" r="2.2"/>
  <circle class="ee-pin" cx="185" cy="125" r="2.2"/>
</svg>
