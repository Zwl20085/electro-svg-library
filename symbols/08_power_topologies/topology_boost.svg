<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180">
  <title>Boost Converter (Step-Up DC-DC)</title>
  <desc>Boost Converter (Step-Up DC-DC)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_boost" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_boost" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_boost" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Input DC source -->
  <line class="ee-stroke" x1="35" y1="40" x2="35" y2="150"/>
  <circle class="ee-body" cx="35" cy="95" r="18"/>
  <text class="ee-label" x="35" y="87">+</text>
  <text class="ee-label" x="35" y="103">−</text>
  <text class="ee-text" x="14" y="95">V<tspan dy="3" font-size="9">in</tspan></text>
  <!-- Input Inductor L -->
  <path class="ee-stroke" d="M 35 40 L 65 40 A 8 9 0 0 1 81 40 A 8 9 0 0 1 97 40 A 8 9 0 0 1 113 40 A 8 9 0 0 1 129 40 L 175 40"/>
  <text class="ee-text" x="97" y="20">L</text>
  <!-- Shunt Switch S -->
  <line class="ee-stroke" x1="155" y1="40" x2="155" y2="81"/>
  <text class="ee-text" x="137" y="95" font-size="11">S</text>
  <rect class="ee-tint-blue" x="145" y="81" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="150" y1="87" x2="150" y2="103"/>
  <path class="ee-thin" d="M 150 91 L 159 85 L 159 81"/>
  <path class="ee-thin" d="M 150 99 L 159 105 L 159 109"/>
  <polygon class="ee-fill" points="160,98 164,98 162,92"/>
  <line class="ee-stroke" x1="155" y1="109" x2="155" y2="150"/>
  <!-- Boost Diode D -->
  <polygon class="ee-body" points="175,30 175,50 197,40"/>
  <line class="ee-stroke" x1="197" y1="30" x2="197" y2="50"/>
  <line class="ee-stroke" x1="197" y1="40" x2="295" y2="40"/>
  <text class="ee-text" x="186" y="20">D</text>
  <!-- Output Capacitor C -->
  <line class="ee-stroke" x1="240" y1="40" x2="240" y2="90"/>
  <line class="ee-stroke" x1="228" y1="90" x2="252" y2="90"/>
  <line class="ee-stroke" x1="228" y1="98" x2="252" y2="98"/>
  <line class="ee-stroke" x1="240" y1="98" x2="240" y2="150"/>
  <text class="ee-text" x="216" y="95">C<tspan dy="3" font-size="8">o</tspan></text>
  <!-- Load R -->
  <line class="ee-stroke" x1="295" y1="40" x2="295" y2="75"/>
  <rect class="ee-body" x="287" y="75" width="16" height="40"/>
  <line class="ee-stroke" x1="295" y1="115" x2="295" y2="150"/>
  <text class="ee-text" x="320" y="95">R<tspan dy="3" font-size="8">L</tspan></text>
  <line class="ee-stroke" x1="35" y1="150" x2="295" y2="150"/>
  <circle class="ee-node" cx="155" cy="40" r="2.5"/>
  <circle class="ee-node" cx="155" cy="150" r="2.5"/>
  <circle class="ee-node" cx="240" cy="40" r="2.5"/>
  <circle class="ee-node" cx="240" cy="150" r="2.5"/>
</svg>
