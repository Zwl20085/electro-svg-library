<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" width="240" height="170">
  <title>3-Phase 6-Pulse Diode Bridge Rectifier</title>
  <desc>3-Phase 6-Pulse Diode Bridge Rectifier</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_3ph_diode_rectifier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_3ph_diode_rectifier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_3ph_diode_rectifier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line class="ee-stroke" x1="60" y1="20" x2="220" y2="20"/>
  <line class="ee-stroke" x1="60" y1="150" x2="220" y2="150"/>
  <!-- 3 Diode Legs at x=75, 130, 185 -->
  <!-- Leg 1 -->
  <line class="ee-stroke" x1="75" y1="20" x2="75" y2="150"/>
  <polygon class="ee-body" points="67,60 83,60 75,44"/><line class="ee-stroke" x1="67" y1="44" x2="83" y2="44"/>
  <polygon class="ee-body" points="67,126 83,126 75,110"/><line class="ee-stroke" x1="67" y1="110" x2="83" y2="110"/>
  <!-- Leg 2 -->
  <line class="ee-stroke" x1="130" y1="20" x2="130" y2="150"/>
  <polygon class="ee-body" points="122,60 138,60 130,44"/><line class="ee-stroke" x1="122" y1="44" x2="138" y2="44"/>
  <polygon class="ee-body" points="122,126 138,126 130,110"/><line class="ee-stroke" x1="122" y1="110" x2="138" y2="110"/>
  <!-- Leg 3 -->
  <line class="ee-stroke" x1="185" y1="20" x2="185" y2="150"/>
  <polygon class="ee-body" points="177,60 193,60 185,44"/><line class="ee-stroke" x1="177" y1="44" x2="193" y2="44"/>
  <polygon class="ee-body" points="177,126 193,126 185,110"/><line class="ee-stroke" x1="177" y1="110" x2="193" y2="110"/>
  <!-- 3-Phase AC Inputs -->
  <line class="ee-wire-a" x1="15" y1="74" x2="75" y2="74"/>
  <line class="ee-wire-b" x1="15" y1="85" x2="130" y2="85"/>
  <line class="ee-wire-c" x1="15" y1="96" x2="185" y2="96"/>
  <circle class="ee-node" cx="75" cy="74" r="2.5"/>
  <circle class="ee-node" cx="130" cy="85" r="2.5"/>
  <circle class="ee-node" cx="185" cy="96" r="2.5"/>
  <circle class="ee-node" cx="75" cy="20" r="2.5"/>
  <circle class="ee-node" cx="130" cy="20" r="2.5"/>
  <circle class="ee-node" cx="75" cy="150" r="2.5"/>
  <circle class="ee-node" cx="130" cy="150" r="2.5"/>
  <circle class="ee-pin" cx="15" cy="74" r="2.2"/>
  <circle class="ee-pin" cx="15" cy="85" r="2.2"/>
  <circle class="ee-pin" cx="15" cy="96" r="2.2"/>
  <circle class="ee-pin" cx="220" cy="20" r="2.2"/>
  <circle class="ee-pin" cx="220" cy="150" r="2.2"/>
</svg>
