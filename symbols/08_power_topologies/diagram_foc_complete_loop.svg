<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240">
  <title>Complete PMSM Field-Oriented Control (FOC) Architecture</title>
  <desc>Complete PMSM Field-Oriented Control (FOC) Architecture</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-diagram_foc_complete_loop" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-diagram_foc_complete_loop" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-diagram_foc_complete_loop" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="8" y="8" width="444" height="224" rx="6"/>
  <!-- Speed Error & PI -->
  <circle class="ee-body" cx="42" cy="55" r="10"/><text class="ee-label" x="42" y="55">Σ</text>
  <line class="ee-stroke" x1="16" y1="55" x2="32" y2="55"/><text class="ee-text" x="22" y="42" font-size="10">ω*</text>
  <line class="ee-stroke" x1="52" y1="55" x2="72" y2="55"/>
  <rect class="ee-tint-blue" x="72" y="42" width="38" height="26" rx="3"/><text class="ee-label" x="91" y="55">PI<tspan dy="2" font-size="7">ω</tspan></text>
  <!-- q-axis Current Error & PI -->
  <line class="ee-stroke" x1="110" y1="55" x2="135" y2="55"/><text class="ee-text" x="122" y="44" font-size="10">i<tspan dy="2" font-size="7">q</tspan>*</text>
  <circle class="ee-body" cx="145" cy="55" r="10"/><text class="ee-label" x="145" y="55">Σ</text>
  <line class="ee-stroke" x1="155" y1="55" x2="175" y2="55"/>
  <rect class="ee-tint-blue" x="175" y="42" width="38" height="26" rx="3"/><text class="ee-label" x="194" y="55">PI<tspan dy="2" font-size="7">q</tspan></text>
  <!-- d-axis Current Error (id* = 0) & PI -->
  <line class="ee-stroke" x1="110" y1="105" x2="135" y2="105"/><text class="ee-text" x="118" y="94" font-size="10">i<tspan dy="2" font-size="7">d</tspan>*=0</text>
  <circle class="ee-body" cx="145" cy="105" r="10"/><text class="ee-label" x="145" y="105">Σ</text>
  <line class="ee-stroke" x1="155" y1="105" x2="175" y2="105"/>
  <rect class="ee-tint-blue" x="175" y="92" width="38" height="26" rx="3"/><text class="ee-label" x="194" y="105">PI<tspan dy="2" font-size="7">d</tspan></text>
  <!-- Inverse Park dq -> alpha/beta -->
  <line class="ee-stroke" x1="213" y1="55" x2="235" y2="55"/>
  <line class="ee-stroke" x1="213" y1="105" x2="235" y2="105"/>
  <rect class="ee-body" x="235" y="42" width="44" height="76" rx="3"/>
  <text class="ee-label" x="257" y="66">dq</text>
  <text class="ee-label" x="257" y="94">αβ</text>
  <line class="ee-thin" x1="235" y1="118" x2="279" y2="42"/>
  <!-- SVPWM + VSI -->
  <line class="ee-stroke" x1="279" y1="65" x2="298" y2="65"/>
  <line class="ee-stroke" x1="279" y1="95" x2="298" y2="95"/>
  <rect class="ee-tint-amber" x="298" y="42" width="54" height="76" rx="3"/>
  <text class="ee-label" x="325" y="72">SVPWM</text>
  <text class="ee-label" x="325" y="90">+ VSI</text>
  <!-- 3-Phase Wires to PMSM -->
  <line class="ee-wire-a" x1="352" y1="60" x2="392" y2="60"/>
  <line class="ee-wire-b" x1="352" y1="80" x2="388" y2="80"/>
  <line class="ee-wire-c" x1="352" y1="100" x2="392" y2="100"/>
  <circle class="ee-body" cx="414" cy="80" r="24"/>
  <text class="ee-text" x="414" y="76" font-size="11">PMSM</text>
  <text class="ee-label" x="414" y="90">3~</text>
  <!-- Feedback Park Transform abc -> dq -->
  <rect class="ee-body" x="235" y="145" width="54" height="52" rx="3"/>
  <text class="ee-label" x="262" y="162">abc → dq</text>
  <text class="ee-label" x="262" y="180">(Park)</text>
  <path class="ee-thin" d="M 372 60 L 372 158 L 289 158"/>
  <path class="ee-thin" d="M 380 100 L 380 182 L 289 182"/>
  <path class="ee-thin" d="M 235 158 L 145 158 L 145 65" marker-end="url(#arrow-diagram_foc_complete_loop)"/>
  <path class="ee-thin" d="M 235 182 L 160 182 L 160 128 L 145 128 L 145 115" marker-end="url(#arrow-diagram_foc_complete_loop)"/>
  <!-- Rotor Speed/Position Feedback -->
  <path class="ee-dashed" d="M 414 104 L 414 212 L 42 212 L 42 65" marker-end="url(#arrow-diagram_foc_complete_loop)"/>
  <text class="ee-text" x="340" y="204" font-size="10">θ<tspan dy="2" font-size="7">e</tspan>, ω<tspan dy="2" font-size="7">r</tspan></text>
</svg>
