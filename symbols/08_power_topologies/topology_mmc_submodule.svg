<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 160" width="170" height="160">
  <title>MMC Half-Bridge Submodule (HB-SM)</title>
  <desc>MMC Half-Bridge Submodule (HB-SM)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_mmc_submodule" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_mmc_submodule" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_mmc_submodule" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="28" y="15" width="124" height="130" rx="6"/>
  <!-- Upper IGBT T1 -->
  <line class="ee-stroke" x1="70" y1="25" x2="70" y2="38"/>
  <text class="ee-text" x="52" y="52" font-size="11">T1</text>
  <rect class="ee-tint-blue" x="60" y="38" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="65" y1="44" x2="65" y2="60"/>
  <path class="ee-thin" d="M 65 48 L 74 42 L 74 38"/>
  <path class="ee-thin" d="M 65 56 L 74 62 L 74 66"/>
  <polygon class="ee-fill" points="75,55 79,55 77,49"/>
  <line class="ee-stroke" x1="70" y1="66" x2="70" y2="94"/>
  <text class="ee-text" x="52" y="108" font-size="11">T2</text>
  <rect class="ee-tint-blue" x="60" y="94" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="65" y1="100" x2="65" y2="116"/>
  <path class="ee-thin" d="M 65 104 L 74 98 L 74 94"/>
  <path class="ee-thin" d="M 65 112 L 74 118 L 74 122"/>
  <polygon class="ee-fill" points="75,111 79,111 77,105"/>
  <line class="ee-stroke" x1="70" y1="122" x2="70" y2="135"/>
  <!-- Submodule Capacitor Csm -->
  <line class="ee-stroke" x1="70" y1="25" x2="122" y2="25"/>
  <line class="ee-stroke" x1="122" y1="25" x2="122" y2="74"/>
  <line class="ee-stroke" x1="110" y1="74" x2="134" y2="74"/>
  <line class="ee-stroke" x1="110" y1="84" x2="134" y2="84"/>
  <line class="ee-stroke" x1="122" y1="84" x2="122" y2="135"/>
  <line class="ee-stroke" x1="70" y1="135" x2="122" y2="135"/>
  <text class="ee-text" x="138" y="55" font-size="11">C<tspan dy="2" font-size="8">sm</tspan></text>
  <!-- External SM Terminals -->
  <line class="ee-stroke" x1="8" y1="80" x2="70" y2="80"/>
  <line class="ee-stroke" x1="8" y1="135" x2="70" y2="135"/>
  <text class="ee-text" x="18" y="68" font-size="11">+v<tspan dy="2" font-size="8">sm</tspan></text>
  <circle class="ee-node" cx="70" cy="80" r="2.5"/>
  <circle class="ee-node" cx="70" cy="135" r="2.5"/>
  <circle class="ee-pin" cx="8" cy="80" r="2.2"/>
  <circle class="ee-pin" cx="8" cy="135" r="2.2"/>
</svg>
