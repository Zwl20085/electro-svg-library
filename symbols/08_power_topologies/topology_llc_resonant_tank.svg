<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140">
  <title>LLC Resonant Tank Stage (Cr, Lr, Lm)</title>
  <desc>LLC Resonant Tank Stage (Cr, Lr, Lm)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_llc_resonant_tank" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_llc_resonant_tank" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_llc_resonant_tank" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line class="ee-stroke" x1="15" y1="45" x2="42" y2="45"/>
  <!-- Resonant Capacitor Cr -->
  <line class="ee-stroke" x1="42" y1="30" x2="42" y2="60"/>
  <line class="ee-stroke" x1="50" y1="30" x2="50" y2="60"/>
  <text class="ee-text" x="46" y="18">C<tspan dy="3" font-size="8">r</tspan></text>
  <!-- Resonant Inductor Lr -->
  <path class="ee-stroke" d="M 50 45 L 72 45 A 7 8 0 0 1 86 45 A 7 8 0 0 1 100 45 A 7 8 0 0 1 114 45 L 185 45"/>
  <text class="ee-text" x="93" y="22">L<tspan dy="3" font-size="8">r</tspan></text>
  <!-- Magnetizing Inductance Lm -->
  <path class="ee-stroke" d="M 145 45 L 145 62 A 6 6 0 0 1 145 74 A 6 6 0 0 1 145 86 A 6 6 0 0 1 145 98 L 145 115"/>
  <text class="ee-text" x="125" y="80">L<tspan dy="3" font-size="8">m</tspan></text>
  <!-- Transformer Primary & Secondary -->
  <path class="ee-stroke" d="M 185 45 L 185 58 A 6 6 0 0 1 185 70 A 6 6 0 0 1 185 82 A 6 6 0 0 1 185 94 L 185 115"/>
  <line class="ee-dashed" x1="198" y1="42" x2="198" y2="118"/>
  <line class="ee-dashed" x1="204" y1="42" x2="204" y2="118"/>
  <path class="ee-stroke" d="M 245 45 L 216 45 A 6 6 0 0 0 216 62 A 6 6 0 0 0 216 80 A 6 6 0 0 0 216 98 A 6 6 0 0 0 216 115 L 245 115"/>
  <line class="ee-stroke" x1="15" y1="115" x2="185" y2="115"/>
  <circle class="ee-node" cx="145" cy="45" r="2.5"/>
  <circle class="ee-node" cx="145" cy="115" r="2.5"/>
  <circle class="ee-pin" cx="15" cy="45" r="2.2"/>
  <circle class="ee-pin" cx="15" cy="115" r="2.2"/>
  <circle class="ee-pin" cx="245" cy="45" r="2.2"/>
  <circle class="ee-pin" cx="245" cy="115" r="2.2"/>
</svg>
