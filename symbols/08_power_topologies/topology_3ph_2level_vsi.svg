<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 210" width="390" height="210">
  <title>3-Phase 2-Level VSI Motor Drive Topology</title>
  <desc>3-Phase 2-Level VSI Motor Drive Topology</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-topology_3ph_2level_vsi" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-topology_3ph_2level_vsi" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-topology_3ph_2level_vsi" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- DC Link Rails -->
  <line class="ee-stroke" x1="20" y1="25" x2="255" y2="25"/>
  <line class="ee-stroke" x1="20" y1="185" x2="255" y2="185"/>
  <!-- DC Link Capacitor -->
  <line class="ee-stroke" x1="45" y1="25" x2="45" y2="98"/>
  <line class="ee-stroke" x1="33" y1="98" x2="57" y2="98"/>
  <line class="ee-stroke" x1="33" y1="108" x2="57" y2="108"/>
  <line class="ee-stroke" x1="45" y1="108" x2="45" y2="185"/>
  <text class="ee-text" x="22" y="105">C<tspan dy="3" font-size="8">dc</tspan></text>
  <!-- Phase Leg A (x=105) -->
  <line class="ee-stroke" x1="105" y1="25" x2="105" y2="44"/>
  <text class="ee-text" x="87" y="58" font-size="11">Sa+</text>
  <rect class="ee-tint-blue" x="95" y="44" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="100" y1="50" x2="100" y2="66"/>
  <path class="ee-thin" d="M 100 54 L 109 48 L 109 44"/>
  <path class="ee-thin" d="M 100 62 L 109 68 L 109 72"/>
  <polygon class="ee-fill" points="110,61 114,61 112,55"/>
  <line class="ee-stroke" x1="105" y1="72" x2="105" y2="138"/>
  <text class="ee-text" x="87" y="152" font-size="11">Sa-</text>
  <rect class="ee-tint-blue" x="95" y="138" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="100" y1="144" x2="100" y2="160"/>
  <path class="ee-thin" d="M 100 148 L 109 142 L 109 138"/>
  <path class="ee-thin" d="M 100 156 L 109 162 L 109 166"/>
  <polygon class="ee-fill" points="110,155 114,155 112,149"/>
  <line class="ee-stroke" x1="105" y1="166" x2="105" y2="185"/>
  <!-- Phase Leg B (x=175) -->
  <line class="ee-stroke" x1="175" y1="25" x2="175" y2="44"/>
  <text class="ee-text" x="157" y="58" font-size="11">Sb+</text>
  <rect class="ee-tint-blue" x="165" y="44" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="170" y1="50" x2="170" y2="66"/>
  <path class="ee-thin" d="M 170 54 L 179 48 L 179 44"/>
  <path class="ee-thin" d="M 170 62 L 179 68 L 179 72"/>
  <polygon class="ee-fill" points="180,61 184,61 182,55"/>
  <line class="ee-stroke" x1="175" y1="72" x2="175" y2="138"/>
  <text class="ee-text" x="157" y="152" font-size="11">Sb-</text>
  <rect class="ee-tint-blue" x="165" y="138" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="170" y1="144" x2="170" y2="160"/>
  <path class="ee-thin" d="M 170 148 L 179 142 L 179 138"/>
  <path class="ee-thin" d="M 170 156 L 179 162 L 179 166"/>
  <polygon class="ee-fill" points="180,155 184,155 182,149"/>
  <line class="ee-stroke" x1="175" y1="166" x2="175" y2="185"/>
  <!-- Phase Leg C (x=245) -->
  <line class="ee-stroke" x1="245" y1="25" x2="245" y2="44"/>
  <text class="ee-text" x="227" y="58" font-size="11">Sc+</text>
  <rect class="ee-tint-blue" x="235" y="44" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="240" y1="50" x2="240" y2="66"/>
  <path class="ee-thin" d="M 240 54 L 249 48 L 249 44"/>
  <path class="ee-thin" d="M 240 62 L 249 68 L 249 72"/>
  <polygon class="ee-fill" points="250,61 254,61 252,55"/>
  <line class="ee-stroke" x1="245" y1="72" x2="245" y2="138"/>
  <text class="ee-text" x="227" y="152" font-size="11">Sc-</text>
  <rect class="ee-tint-blue" x="235" y="138" width="20" height="28" rx="2"/>
  <line class="ee-thin" x1="240" y1="144" x2="240" y2="160"/>
  <path class="ee-thin" d="M 240 148 L 249 142 L 249 138"/>
  <path class="ee-thin" d="M 240 156 L 249 162 L 249 166"/>
  <polygon class="ee-fill" points="250,155 254,155 252,149"/>
  <line class="ee-stroke" x1="245" y1="166" x2="245" y2="185"/>
  <!-- 3-Phase AC Outputs to PMSM -->
  <line class="ee-wire-a" x1="105" y1="90" x2="320" y2="90"/>
  <line class="ee-wire-b" x1="175" y1="105" x2="316" y2="105"/>
  <line class="ee-wire-c" x1="245" y1="120" x2="320" y2="120"/>
  <!-- PMSM Load -->
  <circle class="ee-body" cx="345" cy="105" r="28"/>
  <text class="ee-text" x="345" y="98" font-size="13">PMSM</text>
  <text class="ee-label" x="345" y="114">3~</text>
  <circle class="ee-node" cx="45" cy="25" r="2.5"/>
  <circle class="ee-node" cx="45" cy="185" r="2.5"/>
  <circle class="ee-node" cx="105" cy="25" r="2.5"/>
  <circle class="ee-node" cx="175" cy="25" r="2.5"/>
  <circle class="ee-node" cx="105" cy="185" r="2.5"/>
  <circle class="ee-node" cx="175" cy="185" r="2.5"/>
  <circle class="ee-node" cx="105" cy="90" r="2.5"/>
  <circle class="ee-node" cx="175" cy="105" r="2.5"/>
  <circle class="ee-node" cx="245" cy="120" r="2.5"/>
</svg>
