<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="340" height="210">
  <title>Carrier-Based SPWM Modulation &amp; Gate Pulse Diagram</title>
  <desc>Carrier-Based SPWM Modulation &amp; Gate Pulse Diagram</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-waveform_spwm_carrier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-waveform_spwm_carrier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-waveform_spwm_carrier" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="10" y="10" width="320" height="190" rx="4"/>
  <!-- Upper subplot: Carrier vs Reference -->
  <line class="ee-thin" x1="40" y1="22" x2="40" y2="110"/>
  <line class="ee-grid" x1="40" y1="65" x2="305" y2="65"/>
  <!-- High-frequency Triangle Carrier -->
  <path class="ee-thin" d="M 40 95 L 62 35 L 84 95 L 106 35 L 128 95 L 150 35 L 172 95 L 194 35 L 216 95 L 238 35 L 260 95 L 282 35 L 304 95" stroke="#6b7280"/>
  <!-- Sinusoidal Modulation Reference v_ref -->
  <polyline points="40.0,65.0 44.0,62.5 48.0,60.0 52.0,57.6 56.0,55.2 60.0,52.9 64.0,50.8 68.0,48.7 72.0,46.8 76.0,45.1 80.0,43.6 84.0,42.3 88.0,41.2 92.0,40.3 96.0,39.6 100.0,39.2 104.0,39.0 108.0,39.1 112.0,39.4 116.0,39.9 120.0,40.7 124.0,41.7 128.0,42.9 132.0,44.3 136.0,46.0 140.0,47.8 144.0,49.7 148.0,51.8 152.0,54.0 156.0,56.4 160.0,58.8 164.0,61.2 168.0,63.7 172.0,66.3 176.0,68.8 180.0,71.2 184.0,73.6 188.0,76.0 192.0,78.2 196.0,80.3 200.0,82.2 204.0,84.0 208.0,85.7 212.0,87.1 216.0,88.3 220.0,89.3 224.0,90.1 228.0,90.6 232.0,90.9 236.0,91.0 240.0,90.8 244.0,90.4 248.0,89.7 252.0,88.8 256.0,87.7 260.0,86.4 264.0,84.9 268.0,83.2 272.0,81.3 276.0,79.2 280.0,77.1 284.0,74.8 288.0,72.4 292.0,70.0 296.0,67.5 300.0,65.0" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <!-- Lower subplot: PWM Gate Output -->
  <line class="ee-thin" x1="40" y1="125" x2="40" y2="180"/>
  <line class="ee-thin" x1="40" y1="175" x2="305" y2="175"/>
  <path d="M 40 175 L 48 175 L 48 135 L 78 135 L 78 175 L 88 175 L 88 135 L 124 135 L 124 175 L 136 175 L 136 135 L 164 135 L 164 175 L 184 175 L 184 135 L 204 135 L 204 175 L 232 175 L 232 135 L 244 135 L 244 175 L 276 175 L 276 135 L 288 135 L 288 175 L 304 175" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="ee-text" x="23" y="55" font-size="11">v<tspan dy="2" font-size="8">c</tspan>,v*</text>
  <text class="ee-text" x="23" y="155" font-size="11">S<tspan dy="2" font-size="8">a</tspan></text>
</svg>
