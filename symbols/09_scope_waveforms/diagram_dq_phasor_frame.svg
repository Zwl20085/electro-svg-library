<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 230" width="250" height="230">
  <title>Machine Reference Frames &amp; Phasor Diagram (abc / αβ / dq)</title>
  <desc>Machine Reference Frames &amp; Phasor Diagram (abc / αβ / dq)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-diagram_dq_phasor_frame" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-diagram_dq_phasor_frame" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-diagram_dq_phasor_frame" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="10" y="10" width="230" height="210" rx="4"/>
  <!-- Stationary alpha-beta axes -->
  <line class="ee-stroke" x1="35" y1="145" x2="215" y2="145" marker-end="url(#arrow-diagram_dq_phasor_frame)"/>
  <line class="ee-stroke" x1="95" y1="195" x2="95" y2="25" marker-end="url(#arrow-diagram_dq_phasor_frame)"/>
  <text class="ee-text" x="218" y="158">α (a)</text>
  <text class="ee-text" x="80" y="28">β</text>
  <!-- Rotating d-q axes (rotated by theta_e = 30 deg) -->
  <line class="ee-wire-c" x1="95" y1="145" x2="195" y2="87" marker-end="url(#arrow-blue-diagram_dq_phasor_frame)"/>
  <line class="ee-wire-c" x1="95" y1="145" x2="37" y2="45" marker-end="url(#arrow-blue-diagram_dq_phasor_frame)"/>
  <text class="ee-text" x="206" y="82">d</text>
  <text class="ee-text" x="28" y="42">q</text>
  <!-- Stator Current Vector i_s in 2nd quadrant of d-q (id < 0, iq > 0 for IPMSM MTPA) -->
  <line class="ee-wire-a" x1="95" y1="145" x2="28" y2="75" marker-end="url(#arrow-red-diagram_dq_phasor_frame)"/>
  <line class="ee-dashed" x1="55" y1="76" x2="28" y2="75"/>
  <text class="ee-text" x="24" y="64">i<tspan dy="2" font-size="8">s</tspan> (i<tspan dy="2" font-size="7">d</tspan>&lt;0)</text>
  <!-- Rotor Flux Linkage psi_m along +d-axis -->
  <line class="ee-thick" x1="95" y1="145" x2="155" y2="110" marker-end="url(#arrow-diagram_dq_phasor_frame)"/>
  <text class="ee-text" x="165" y="120">ψ<tspan dy="2" font-size="8">m</tspan></text>
  <!-- Angle arc theta_e -->
  <path class="ee-thin" d="M 140 145 A 45 45 0 0 0 134 122"/>
  <text class="ee-text" x="152" y="134" font-size="11">θ<tspan dy="2" font-size="8">e</tspan></text>
</svg>
