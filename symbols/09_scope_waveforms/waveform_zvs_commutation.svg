<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <title>Zero-Voltage Switching (ZVS) Turn-On &amp; Dead-Time Waveform</title>
  <desc>Zero-Voltage Switching (ZVS) Turn-On &amp; Dead-Time Waveform</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-waveform_zvs_commutation" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-waveform_zvs_commutation" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-waveform_zvs_commutation" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="10" y="10" width="300" height="190" rx="4"/>
  <!-- Shaded Dead-Time region td -->
  <rect x="95" y="25" width="45" height="145" fill="#fef3c7" stroke="none"/>
  <line class="ee-dashed" x1="95" y1="25" x2="95" y2="170"/>
  <line class="ee-dashed" x1="140" y1="25" x2="140" y2="170"/>
  <text class="ee-label" x="117" y="34">t<tspan dy="2" font-size="7">dead</tspan></text>
  <!-- High-side gate v_gs1 -->
  <path d="M 40 50 L 95 50 L 95 75 L 280 75" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text class="ee-text" x="25" y="62" font-size="10">v<tspan dy="2" font-size="7">gs1</tspan></text>
  <!-- Low-side gate v_gs2 -->
  <path d="M 40 115 L 140 115 L 140 90 L 280 90" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text class="ee-text" x="25" y="104" font-size="10">v<tspan dy="2" font-size="7">gs2</tspan></text>
  <!-- v_ds2 falling to zero BEFORE v_gs2 turns on, i_ds2 rising -->
  <path d="M 40 132 L 95 132 L 122 168 L 280 168" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 40 168 L 122 168 L 140 155 L 180 132 L 280 132" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="140" cy="168" r="4" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text class="ee-label" x="172" y="178">ZVS Turn-On</text>
  <text class="ee-text" x="25" y="150" font-size="10">v<tspan dy="2" font-size="7">ds</tspan>,i<tspan dy="2" font-size="7">d</tspan></text>
</svg>
