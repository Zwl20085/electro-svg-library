<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260">
  <title>4-Channel Digital Oscilloscope Plot (v_gs, v_ds, i_L, i_a)</title>
  <desc>4-Channel Digital Oscilloscope Plot (v_gs, v_ds, i_L, i_a)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-scope_4ch_power_electronics" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-scope_4ch_power_electronics" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-scope_4ch_power_electronics" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- Outer frame -->
  <rect class="ee-body" x="10" y="10" width="360" height="240" rx="4"/>
  <!-- Plot area -->
  <rect x="45" y="25" width="295" height="205" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <!-- Graticule grid -->
  <line class="ee-grid" x1="104" y1="25" x2="104" y2="230"/>
  <line class="ee-grid" x1="163" y1="25" x2="163" y2="230"/>
  <line class="ee-grid" x1="222" y1="25" x2="222" y2="230"/>
  <line class="ee-grid" x1="281" y1="25" x2="281" y2="230"/>
  <line class="ee-grid" x1="45" y1="75" x2="340" y2="75"/>
  <line class="ee-grid" x1="45" y1="125" x2="340" y2="125"/>
  <line class="ee-grid" x1="45" y1="175" x2="340" y2="175"/>
  <!-- CH1: Gate Pulse v_gs (Blue) -->
  <path d="M 45 66 L 75 66 L 75 38 L 130 38 L 130 66 L 165 66 L 165 38 L 220 38 L 220 66 L 255 66 L 255 38 L 310 38 L 310 66 L 340 66" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text class="ee-text" x="26" y="52" font-size="11">v<tspan dy="2" font-size="8">gs</tspan></text>
  <!-- CH2: Drain-Source Voltage v_ds with switching ringing (Red) -->
  <path d="M 45 86 L 75 86 L 75 116 L 77 110 L 79 118 L 81 115 L 130 115 L 130 82 L 132 90 L 134 85 L 136 86 L 165 86 L 165 116 L 167 110 L 169 115 L 220 115 L 220 82 L 222 89 L 224 86 L 255 86 L 255 115 L 310 115 L 310 86 L 340 86" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text class="ee-text" x="26" y="102" font-size="11">v<tspan dy="2" font-size="8">ds</tspan></text>
  <!-- CH3: Triangular Inductor Current Ripple i_L (Green) -->
  <path d="M 45 162 L 75 168 L 130 140 L 165 168 L 220 140 L 255 168 L 310 140 L 340 158" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <text class="ee-text" x="26" y="155" font-size="11">i<tspan dy="2" font-size="8">L</tspan></text>
  <!-- CH4: Sinusoidal Phase Current i_a (Amber/Dark) -->
  <polyline points="45.0,215.0 49.0,211.8 53.0,208.7 57.0,205.8 61.0,203.2 65.0,200.9 69.0,199.1 73.0,197.9 77.0,197.2 81.0,197.0 85.0,197.5 89.0,198.4 93.0,200.0 97.0,202.0 101.0,204.4 105.0,207.2 109.0,210.2 113.0,213.4 117.0,216.6 121.0,219.8 125.0,222.8 129.0,225.6 133.0,228.0 137.0,230.0 141.0,231.6 145.0,232.5 149.0,233.0 153.0,232.8 157.0,232.1 161.0,230.9 165.0,229.1 169.0,226.8 173.0,224.2 177.0,221.3 181.0,218.2 185.0,215.0 189.0,211.8 193.0,208.7 197.0,205.8 201.0,203.2 205.0,200.9 209.0,199.1 213.0,197.9 217.0,197.2 221.0,197.0 225.0,197.5 229.0,198.4 233.0,200.0 237.0,202.0 241.0,204.4 245.0,207.2 249.0,210.2 253.0,213.4 257.0,216.6 261.0,219.8 265.0,222.8 269.0,225.6 273.0,228.0 277.0,230.0 281.0,231.6 285.0,232.5 289.0,233.0 293.0,232.8 297.0,232.1 301.0,230.9 305.0,229.1 309.0,226.8 313.0,224.2 317.0,221.3 321.0,218.2 325.0,215.0 329.0,211.8 333.0,208.7 337.0,205.8" fill="none" stroke="#d97706" stroke-width="2"/>
  <text class="ee-text" x="26" y="210" font-size="11">i<tspan dy="2" font-size="8">a</tspan></text>
  <!-- Scale bar annotation -->
  <text class="ee-label" x="192" y="242">Time (10 μs/div)</text>
</svg>
