<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <title>Half-Bridge Phase Leg Module (2-in-1)</title>
  <desc>Half-Bridge Phase Leg Module (2-in-1)</desc>
  <defs>
    <style>
      .ee-stroke { stroke: #111827; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thin { stroke: #111827; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-thick { stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-dashed { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .ee-fill { fill: #111827; stroke: #111827; stroke-width: 1.5; stroke-linejoin: round; }
      .ee-body { fill: #f8fafc; stroke: #111827; stroke-width: 2; stroke-linejoin: round; }
      .ee-tint-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-tint-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; stroke-linejoin: round; }
      .ee-wire-a { stroke: #dc2626; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-b { stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-wire-c { stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ee-text { font-family: 'Times New Roman', 'STIX Two Text', Georgia, serif; font-size: 13px; font-style: italic; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .ee-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; dominant-baseline: central; }
      .ee-pin { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .ee-node { fill: #111827; stroke: none; }
      .ee-grid { stroke: #e5e7eb; stroke-width: 0.8; stroke-dasharray: 2 2; fill: none; }
    </style>
    <marker id="arrow-half_bridge_leg_module" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red-half_bridge_leg_module" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue-half_bridge_leg_module" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="ee-body" x="18" y="10" width="64" height="120" rx="5"/>
  <!-- Upper switch -->
  <line class="ee-stroke" x1="46" y1="10" x2="46" y2="28"/>
  <line class="ee-stroke" x1="34" y1="28" x2="34" y2="48"/>
  <path class="ee-stroke" d="M 34 33 L 46 25"/>
  <path class="ee-stroke" d="M 34 43 L 46 51" marker-end="url(#arrow-half_bridge_leg_module)"/>
  <polygon class="ee-body" points="58,44 68,44 63,32"/>
  <line class="ee-stroke" x1="58" y1="32" x2="68" y2="32"/>
  <path class="ee-thin" d="M 46 22 L 63 22 L 63 54 L 46 54"/>
  <!-- Midpoint -->
  <line class="ee-stroke" x1="46" y1="51" x2="46" y2="88"/>
  <line class="ee-stroke" x1="46" y1="70" x2="92" y2="70"/>
  <!-- Lower switch -->
  <line class="ee-stroke" x1="34" y1="84" x2="34" y2="104"/>
  <path class="ee-stroke" d="M 34 89 L 46 81"/>
  <path class="ee-stroke" d="M 34 99 L 46 107" marker-end="url(#arrow-half_bridge_leg_module)"/>
  <polygon class="ee-body" points="58,100 68,100 63,88"/>
  <line class="ee-stroke" x1="58" y1="88" x2="68" y2="88"/>
  <path class="ee-thin" d="M 46 78 L 63 78 L 63 110 L 46 110"/>
  <line class="ee-stroke" x1="46" y1="107" x2="46" y2="130"/>
  <text class="ee-label" x="32" y="18">+DC</text>
  <text class="ee-label" x="32" y="122">-DC</text>
  <text class="ee-label" x="74" y="62">AC</text>
  <circle class="ee-node" cx="46" cy="70" r="2.5"/>
  <circle class="ee-pin" cx="46" cy="10" r="2.2"/>
  <circle class="ee-pin" cx="46" cy="130" r="2.2"/>
  <circle class="ee-pin" cx="92" cy="70" r="2.2"/>
</svg>
